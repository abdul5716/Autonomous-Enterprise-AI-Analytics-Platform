[project]
name = "analytics-platform"
version = "0.1.0"
description = "Autonomous Enterprise AI Analytics Platform: agentic, evidence-backed answers over SQL, documents and the web."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "ddgs>=9.16.1",
    "duckdb>=2.0.1",
    "faker>=40.63.0",
    "fastembed>=0.9.1",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.111.0",
    "numpy>=2.5.5",
    "oracledb>=26.2.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.4",
    "redis>=5",
    "reportlab>=5.1.2",
    "sqlglot>=30.35.0",
    "tenacity>=9.2.1",
    "trafilatura>=2.4.0",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.41.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_platform", "src/data_gen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "fakeredis.*", "oracledb.*", "reportlab.*", "flashrank.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the docker compose stack"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:SOCKS support in urllib3"]
